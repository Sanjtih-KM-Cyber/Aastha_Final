name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies (exact versions from lockfile)
        working-directory: client
        run: npm ci

      - name: Build Web Assets
        working-directory: client
        run: npm run build

      - name: Sync Capacitor (copies web build + registers native plugins)
        working-directory: client
        run: |
          npx cap sync android
          node scripts/update-manifest.cjs

      # The committed debug APK once shipped with ZERO native plugins (no notifications, no biometrics).
      # Fail the build if any required plugin is missing from the generated plugin registry.
      - name: Verify native plugins are registered
        working-directory: client
        run: |
          PLUGINS=android/app/src/main/assets/capacitor.plugins.json
          test -f "$PLUGINS" || { echo "::error::$PLUGINS missing — cap sync failed"; exit 1; }
          cat "$PLUGINS"
          for p in "@capacitor/local-notifications" "@capacitor/preferences" "@capacitor/app" \
                   "@capgo/capacitor-native-biometric" "@anuradev/capacitor-background-mode" \
                   "@capacitor-community/privacy-screen" "@capacitor/filesystem" "@capacitor/share" \
                   "@jofr/capacitor-media-session"; do
            grep -q "\"$p\"" "$PLUGINS" || { echo "::error::Native plugin $p is not registered"; exit 1; }
          done
          test -f android/app/src/main/assets/public/index.html || { echo "::error::Web build not copied into APK"; exit 1; }
          grep -q "SCHEDULE_EXACT_ALARM" android/app/src/main/AndroidManifest.xml || { echo "::error::Exact alarm permission missing"; exit 1; }
          grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml || { echo "::error::Microphone permission missing (voice notes)"; exit 1; }
          # Repeat button on the lock screen comes from our patch (client/patches, applied by npm ci's postinstall)
          grep -q "Aastha patch" node_modules/@jofr/capacitor-media-session/android/src/main/java/io/github/jofr/capacitor/mediasessionplugin/MediaSessionService.java || { echo "::error::media-session patch not applied (patch-package)"; exit 1; }
          # lock-screen music player: Android 14 crashes a mediaPlayback foreground service without this
          grep -q "FOREGROUND_SERVICE_MEDIA_PLAYBACK" android/app/src/main/AndroidManifest.xml || { echo "::error::Media playback service permission missing (lock-screen music controls)"; exit 1; }

      - name: Build APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aastha-debug-apk-${{ github.run_number }}
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
